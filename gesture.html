<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势粒子特效</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #app-container {
            position: relative; width: 100%; height: 100%;
            background: #000000;
        }
        video { display: none; }
        #webgl-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }
        #back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff; padding: 12px 16px; border-radius: 8px;
            cursor: pointer; backdrop-filter: blur(8px);
            transition: all 0.3s, transform 0.2s;
            font-size: 14px; text-decoration: none;
        }
        #back-btn:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }
        #hint-text {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 10; color: rgba(255, 255, 255, 0.6);
            font-size: 14px; text-align: center; pointer-events: none;
        }
        #music-hint {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            z-index: 10; color: rgba(102, 126, 234, 0.8);
            font-size: 12px; text-align: center; pointer-events: none;
            opacity: 0.8;
        }
        #mute-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff; padding: 12px; border-radius: 8px;
            cursor: pointer; backdrop-filter: blur(8px);
            transition: all 0.3s; font-size: 16px;
        }
        #mute-btn:hover { background: rgba(255, 255, 255, 0.3); }
        #mute-btn.muted { opacity: 0.5; }
    </style>
</head>
<body>
    <div id="app-container">
        <video id="webcam-video" autoplay playsinline></video>
        <canvas id="webgl-canvas"></canvas>
        <a href="./manual.html" id="back-btn">← 返回手册</a>
        <button id="mute-btn" onclick="toggleMute()">🔊</button>
        <div id="music-hint">点击页面任意位置以启用音频</div>
        <div id="hint-text">
            伸出手指控制粒子形态：1-3根手指显示数字，5根手指显示爱心特效<br>
            移动手掌推拉视角，捏合手指吸引粒子
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // ==========================================
        // 音频系统 - Web Audio API 电子音效 + BGM
        // ==========================================
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.initialized = false;
                this.muted = false;
                this.bgmAudio = null;
            }

            init() {
                if (this.initialized) return;
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    this.initialized = true;
                    document.getElementById('music-hint').textContent = '🎵 音频已启用';
                    setTimeout(() => {
                        const hint = document.getElementById('music-hint');
                        if (hint) hint.style.opacity = '0';
                    }, 2000);
                    this.startBGM();
                } catch(e) {
                    console.log('Audio init failed:', e);
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                if (this.bgmAudio) {
                    this.bgmAudio.muted = this.muted;
                }
                document.getElementById('mute-btn').textContent = this.muted ? '🔇' : '🔊';
                document.getElementById('mute-btn').classList.toggle('muted', this.muted);
            }

            startBGM() {
                if (!this.ctx) return;
                this.bgmAudio = new Audio('./audio/bgm-simple.mp3');
                this.bgmAudio.loop = true;
                this.bgmAudio.volume = 0.4;
                this.bgmAudio.play().catch(e => console.log('BGM play failed:', e));
            }

            playTone(freq, duration, type = 'sine', volume = 0.3) {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(volume * 0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            // 手势切换音效
            playGestureChange(gesture) {
                if (!this.ctx || this.muted) return;
                const freqs = {
                    0: [220, 277, 330],
                    1: [523, 659, 784],
                    2: [587, 740, 880],
                    3: [659, 830, 988],
                    5: [784, 988, 1175],
                };
                const chord = freqs[gesture] || freqs[0];
                
                chord.forEach((freq, i) => {
                    setTimeout(() => {
                        this.playTone(freq, 0.8, 'sine', 0.15);
                        this.playTone(freq * 2, 0.4, 'triangle', 0.05);
                    }, i * 80);
                });
            }

            // 捏合音效
            playPinch(duration = 0.1) {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + duration);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            // 爱心特效
            playLoveChord() {
                if (!this.ctx || this.muted) return;
                const chord = [523, 659, 784, 1047];
                
                chord.forEach((freq, i) => {
                    setTimeout(() => {
                        this.playTone(freq, 1.5, 'sine', 0.12);
                        this.playTone(freq * 0.5, 1.5, 'triangle', 0.05);
                    }, i * 150);
                });

                setTimeout(() => {
                    this.playTone(1319, 0.5, 'sine', 0.08);
                    this.playTone(1568, 0.5, 'sine', 0.08);
                }, 600);
            }
        }

        const audioSystem = new AudioSystem();
        function toggleMute() { audioSystem.toggleMute(); }

        // ==========================================
        // Three.js 粒子系统
        // ==========================================
        const PARTICLE_COUNT = 5000;
        let scene, camera, renderer, particleGeometry, particleSystem;
        let targets = {};
        let currentTargetState = 0;
        let confettiGroup;
        let handPosition = new THREE.Vector3(-1000, -1000, 0);
        let isPinching = false;
        let palmSize = 0;

        function createSoftCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16,16,0, 16,16,16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(0, 255, 243, 0.8)');
            gradient.addColorStop(0.6, 'rgba(238, 0, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        function initEngine() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 15);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7); scene.add(dirLight);
            confettiGroup = new THREE.Group(); scene.add(confettiGroup);
            buildParticles(); generateAllTargets();
            window.addEventListener('resize', onWindowResize);
        }

        function buildParticles() {
            particleGeometry = new THREE.BufferGeometry();
            const initialPositions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const defaultColor = new THREE.Color(0x00fff3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                initialPositions[i3] = (Math.random() - 0.5) * 20;
                initialPositions[i3 + 1] = (Math.random() - 0.5) * 20;
                initialPositions[i3 + 2] = (Math.random() - 0.5) * 5;
                colors[i3] = defaultColor.r; colors[i3 + 1] = defaultColor.g; colors[i3 + 2] = defaultColor.b;
            }
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(initialPositions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const material = new THREE.PointsMaterial({
                size: 0.16, map: createSoftCircleTexture(), blending: THREE.AdditiveBlending,
                depthWrite: false, transparent: true, vertexColors: true
            });
            particleSystem = new THREE.Points(particleGeometry, material);
            scene.add(particleSystem);
        }

        function fetchPointsFromText(text, count) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const fontSize = text.length > 1 ? 160 : 380;
            ctx.font = `bold ${fontSize}px sans-serif`; ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const rawPoints = [];
            for (let y = 0; y < canvas.height; y += 3) {
                for (let x = 0; x < canvas.width; x += 3) {
                    const index = (y * canvas.width + x) * 4;
                    if (imgData[index] > 128) {
                        rawPoints.push(new THREE.Vector3((x - canvas.width / 2) * 0.024, -(y - canvas.height / 2) * 0.024, (Math.random() - 0.5) * 0.5));
                    }
                }
            }
            const finalPoints = [];
            if (rawPoints.length === 0) { for (let i = 0; i < count; i++) finalPoints.push(new THREE.Vector3(0, 0, 0)); return finalPoints; }
            for (let i = 0; i < count; i++) {
                const sourcePoint = rawPoints[i % rawPoints.length];
                finalPoints.push(new THREE.Vector3(sourcePoint.x + (Math.random() - 0.5) * 0.05, sourcePoint.y + (Math.random() - 0.5) * 0.05, sourcePoint.z + (Math.random() - 0.5) * 0.05));
            }
            return finalPoints;
        }

        function generateAllTargets() {
            const idlePoints = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const u = Math.random(), v = Math.random();
                const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0), r = 3 + Math.random() * 4;
                idlePoints.push(new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi)));
            }
            targets[0] = idlePoints;
            targets[1] = fetchPointsFromText("1", PARTICLE_COUNT);
            targets[2] = fetchPointsFromText("2", PARTICLE_COUNT);
            targets[3] = fetchPointsFromText("3", PARTICLE_COUNT);
            targets[5] = fetchPointsFromText("I LOVE U", PARTICLE_COUNT);
        }

        function spawnCelebrationElements() {
            clearCelebrationElements();
            const colors = [0xff4b72, 0xff8f94, 0xff003c, 0x00d2ff, 0xffd700, 0x9b5de5];
            for (let i = 0; i < 35; i++) {
                const balloon = new THREE.Group();
                const balloonGeo = new THREE.SphereGeometry(0.35, 16, 16);
                balloonGeo.scale(1, 1.25, 1);
                const balloonMat = new THREE.MeshPhongMaterial({ color: colors[Math.floor(Math.random() * colors.length)], shininess: 80, specular: 0xffffff });
                balloon.add(new THREE.Mesh(balloonGeo, balloonMat));
                const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -0.43, 0), new THREE.Vector3(0, -1.5, 0)]);
                balloon.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x555555 })));
                balloon.position.set((Math.random() - 0.5) * 22, -8 - Math.random() * 6, (Math.random() - 0.5) * 8);
                balloon.userData = { speed: 0.05 + Math.random() * 0.04, type: 'balloon', wave: Math.random() * 100 };
                confettiGroup.add(balloon);
                
                const flower = new THREE.Group();
                flower.add(new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffd700 })));
                const petalGeo = new THREE.SphereGeometry(0.1, 8, 8);
                petalGeo.scale(1.4, 0.8, 0.8);
                const petalMat = new THREE.MeshStandardMaterial({ color: 0xff65a3, roughness: 0.4 });
                for (let j = 0; j < 5; j++) {
                    const petal = new THREE.Mesh(petalGeo, petalMat);
                    const angle = (j / 5) * Math.PI * 2;
                    petal.position.set(Math.cos(angle) * 0.18, Math.sin(angle) * 0.18, 0); petal.rotation.z = angle;
                    flower.add(petal);
                }
                flower.position.set((Math.random() - 0.5) * 22, -8 - Math.random() * 6, (Math.random() - 0.5) * 8);
                flower.userData = { speed: 0.04 + Math.random() * 0.03, type: 'flower', rotSpeed: (Math.random() - 0.5) * 0.04 };
                confettiGroup.add(flower);
            }
        }

        function clearCelebrationElements() {
            while (confettiGroup.children.length > 0) { confettiGroup.remove(confettiGroup.children[0]); }
        }

        function parseHandGesture(landmarks) {
            const indexUp = landmarks[8].y < landmarks[6].y;
            const middleUp = landmarks[12].y < landmarks[10].y;
            const ringUp = landmarks[16].y < landmarks[14].y;
            const pinkyUp = landmarks[20].y < landmarks[18].y;
            const thumbUp = Math.abs(landmarks[4].x - landmarks[5].x) > 0.12;
            if (!indexUp && !middleUp && !ringUp && !pinkyUp) return 0;
            if (indexUp && !middleUp && !ringUp && !pinkyUp) return 1;
            if (indexUp && middleUp && !ringUp && !pinkyUp) return 2;
            if (indexUp && middleUp && ringUp && !pinkyUp) return 3;
            if (indexUp && middleUp && ringUp && pinkyUp && thumbUp) return 5;
            return -1;
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const detectedState = parseHandGesture(landmarks);
                
                if (detectedState !== -1 && detectedState !== currentTargetState) {
                    currentTargetState = detectedState;
                    audioSystem.playGestureChange(currentTargetState);
                    
                    if (currentTargetState === 5) {
                        spawnCelebrationElements();
                        audioSystem.playLoveChord();
                    } else if (currentTargetState === 0) {
                        clearCelebrationElements();
                    }
                }
                
                handPosition.set(((1 - landmarks[8].x) - 0.5) * 20, (-(landmarks[8].y - 0.5)) * 14, 0);
                const thumbTip = landmarks[4], indexTip = landmarks[8];
                const dist = Math.sqrt(Math.pow(thumbTip.x - indexTip.x, 2) + Math.pow(thumbTip.y - indexTip.y, 2));
                
                const wasPinching = isPinching;
                isPinching = (dist < 0.05);
                if (isPinching && !wasPinching) {
                    audioSystem.playPinch(0.2);
                }
                
                palmSize = Math.sqrt(Math.pow(landmarks[0].x - landmarks[9].x, 2) + Math.pow(landmarks[0].y - landmarks[9].y, 2));
            } else { 
                handPosition.set(-1000, -1000, 0); isPinching = false; palmSize = 0; 
            }
        }

        function tick() {
            requestAnimationFrame(tick);
            const positionAttr = particleGeometry.attributes.position;
            const colorAttr = particleGeometry.attributes.color;
            const currentTargets = targets[currentTargetState] || targets[0];
            const defaultColor = new THREE.Color(0x00fff3);
            const pinchColor = new THREE.Color(0xff65a3);
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const targetVec = currentTargets[i];
                const i3 = i * 3;
                let nextX = positionAttr.array[i3] + (targetVec.x - positionAttr.array[i3]) * 0.1;
                let nextY = positionAttr.array[i3 + 1] + (targetVec.y - positionAttr.array[i3 + 1]) * 0.1;
                let nextZ = positionAttr.array[i3 + 2] + (targetVec.z - positionAttr.array[i3 + 2]) * 0.1;
                let dx = handPosition.x - nextX, dy = handPosition.y - nextY;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 6) {
                    let force = (6 - dist) / 6;
                    if (isPinching) {
                        nextX += dx * force * 0.4; nextY += dy * force * 0.4;
                        colorAttr.array[i3] = pinchColor.r; colorAttr.array[i3 + 1] = pinchColor.g; colorAttr.array[i3 + 2] = pinchColor.b;
                    } else {
                        nextX += dx * force * 0.1; nextY += dy * force * 0.1;
                        colorAttr.array[i3] = defaultColor.r; colorAttr.array[i3 + 1] = defaultColor.g; colorAttr.array[i3 + 2] = defaultColor.b;
                    }
                } else {
                    colorAttr.array[i3] = defaultColor.r; colorAttr.array[i3 + 1] = defaultColor.g; colorAttr.array[i3 + 2] = defaultColor.b;
                }
                positionAttr.array[i3] = nextX; positionAttr.array[i3 + 1] = nextY; positionAttr.array[i3 + 2] = nextZ;
            }
            positionAttr.needsUpdate = true; colorAttr.needsUpdate = true;
            
            if (palmSize > 0) {
                let targetZ = 20 - (palmSize - 0.1) * (12 / 0.3);
                targetZ = THREE.MathUtils.clamp(targetZ, 8, 20);
                camera.position.z += (targetZ - camera.position.z) * 0.1;
            } else { camera.position.z += (22 - camera.position.z) * 0.05; }
            
            confettiGroup.children.forEach(element => {
                element.position.y += element.userData.speed;
                if (element.userData.type === 'balloon') {
                    element.userData.wave += 0.04; element.position.x += Math.sin(element.userData.wave) * 0.015;
                } else if (element.userData.type === 'flower') {
                    element.rotation.z += element.userData.rotSpeed; element.rotation.x += 0.01;
                }
                if (element.position.y > 14) { element.position.y = -8; element.position.x = (Math.random() - 0.5) * 22; }
            });
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 进入全屏
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(e => console.log('Fullscreen denied:', e));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        // 退出全屏
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initEngine(); tick();
            const videoElement = document.getElementById('webcam-video');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
            hands.onResults(onHandResults);
            const cameraUtils = new Camera(videoElement, { onFrame: async () => { await hands.send({ image: videoElement }); }, width: 640, height: 480 });
            cameraUtils.start();
            
            // 页面加载时尝试初始化音频和全屏
            setTimeout(() => {
                audioSystem.init();
                enterFullscreen();
            }, 500);
            
            // 点击页面时确保音频初始化和全屏
            document.addEventListener('click', () => {
                if (!audioSystem.initialized) {
                    audioSystem.init();
                } else if (audioSystem.ctx && audioSystem.ctx.state === 'suspended') {
                    audioSystem.ctx.resume();
                }
                // 尝试进入全屏
                if (!document.fullscreenElement) {
                    enterFullscreen();
                }
            }, { once: true });

            // ESC键退出全屏时显示提示
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    console.log('已退出全屏模式');
                }
            });
        });
    </script>
</body>
</html>
