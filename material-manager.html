<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材库卡密管理</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        .stat-item {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            flex: 1;
            margin: 0 10px;
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            display: block;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            transition: transform 0.2s;
        }
        .btn:hover:not(:disabled) {
            transform: scale(1.05);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .key-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .key-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .key-value {
            font-family: monospace;
            font-size: 16px;
            color: #333;
            font-weight: bold;
        }
        .key-meta {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        .key-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 10px;
        }
        .status-unused {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-used {
            background: #ffebee;
            color: #c62828;
        }
        .copy-btn {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .message.error {
            background: #ffebee;
            color: #c62828;
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 素材库卡密管理</h1>
        
        <div id="message"></div>
        
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="todayCount">0</span>
                <span class="stat-label">今日生成</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="remainingCount">10</span>
                <span class="stat-label">剩余可生成</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">总卡密数</span>
            </div>
        </div>

        <div style="background: #fff3e0; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center;">
            📅 每日生成上限：10 个卡密 | 卡密有效期：1年
        </div>

        <button class="btn" id="generateBtn" onclick="generateKey()">🔑 生成新卡密</button>

        <div class="key-list">
            <h2 style="margin-bottom: 20px; color: #333;">📋 卡密列表</h2>
            <div id="keyList"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://175.178.60.63:3847';
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.className = 'message ' + type;
            msg.textContent = text;
            setTimeout(() => {
                msg.textContent = '';
                msg.className = 'message';
            }, 3000);
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/admin/licenses`, {
                    headers: { 'x-admin-key': 'admin_key_2024_very_secure_xyz' }
                });
                const data = await response.json();
                const licenses = data.licenses || [];
                
                const today = new Date().toISOString().split('T')[0];
                const todayLicenses = licenses.filter(l => 
                    l.created_at && l.created_at.startsWith(today)
                );
                
                document.getElementById('todayCount').textContent = todayLicenses.length;
                document.getElementById('remainingCount').textContent = Math.max(0, 10 - todayLicenses.length);
                document.getElementById('totalCount').textContent = licenses.length;
                
                const generateBtn = document.getElementById('generateBtn');
                if (todayLicenses.length >= 10) {
                    generateBtn.disabled = true;
                    generateBtn.textContent = '🔒 今日已达上限';
                } else {
                    generateBtn.disabled = false;
                    generateBtn.textContent = '🔑 生成新卡密';
                }
                
                renderKeyList(licenses);
            } catch (err) {
                console.error('加载失败', err);
                showMessage('加载失败，请检查服务器', 'error');
            }
        }
        
        function renderKeyList(licenses) {
            const container = document.getElementById('keyList');
            const today = new Date().toISOString().split('T')[0];
            
            const sorted = [...licenses].sort((a, b) => 
                new Date(b.created_at) - new Date(a.created_at)
            );
            
            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>暂无卡密，点击上方按钮生成</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sorted.map(l => {
                const isExpired = l.expires_at && new Date() > new Date(l.expires_at);
                const statusClass = isExpired ? 'status-used' : (l.used ? 'status-used' : 'status-unused');
                const statusText = isExpired ? '已过期' : (l.used ? '已使用' : '未使用');
                const expiresDate = l.expires_at ? new Date(l.expires_at).toLocaleDateString() : '永久';
                
                return `
                    <div class="key-item">
                        <div class="key-info">
                            <div class="key-value">${l.key}</div>
                            <div class="key-meta">
                                创建: ${new Date(l.created_at).toLocaleString()}
                                | 有效期至: ${expiresDate}
                            </div>
                        </div>
                        <span class="key-status ${statusClass}">${statusText}</span>
                        <button class="copy-btn" onclick="copyKey('${l.key}')">复制</button>
                    </div>
                `;
            }).join('');
        }
        
        async function generateKey() {
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '生成中...';

            try {
                const response = await fetch(`${API_URL}/api/license/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ count: 1, type: 'annual', expiresDays: 365 })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const key = data.keys[0].key;
                    showMessage(`卡密生成成功！卡密: ${key} 有效期: 1年`, 'success');
                    loadStats();
                } else {
                    showMessage(data.error || '生成失败', 'error');
                }
            } catch (err) {
                console.error('生成失败', err);
                showMessage('生成失败，请检查服务器连接', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔑 生成新卡密';
            }
        }
        
        function copyKey(key) {
            navigator.clipboard.writeText(key).then(() => {
                showMessage('已复制卡密', 'success');
            });
        }
        
        window.onload = function() {
            loadStats();
        };
    </script>
</body>
</html>
